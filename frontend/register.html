
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCare - Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>


<body class="auth-page">

    <header>
        <div class="logo">CampusCare</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">

            <h1>Create Account</h1>
            <p class="auth-subtitle">
                Register for your CampusCare account
            </p>

            <form id="registerForm">

                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="studentId">Student ID / Roll Number</label>
                <input type="text" id="studentId"
                       placeholder="Enter your roll number" required>

                <label for="department">Department</label>
                <input type="text" id="department"
                       placeholder="Example: CSE" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Re-enter your password" required>

                <button type="submit" class="auth-btn">
                    Register
                </button>

            </form>

            <p class="auth-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>
    </main>
    <script src="js/auth.js"></script>

</body>
</html>
